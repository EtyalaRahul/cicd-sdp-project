<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Delivery Platform</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Popper & Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    crossorigin="anonymous"
  ></script>

  <style>
    /* Brand Color Theme */
    .bg-brand {
      background-color: #ff5a5f !important;
      color: white !important;
    }

    .btn-brand {
      background-color: #ff5a5f;
      border: none;
      color: #fff;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-brand:hover {
      background-color: #e24a4f;
      transform: scale(1.03);
    }

    /* Image hover effects */
    .welcome-img {
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .welcome-img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <!-- React root -->
  <div id="root"></div>

  <!-- 🌟 Bootstrap Welcome Modal -->
  <div
    class="modal fade"
    id="welcomeModal"
    tabindex="-1"
    aria-labelledby="welcomeModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-brand">
          <h5 class="modal-title fw-bold" id="welcomeModalLabel">
            🍽️ Welcome to FoodieExpress!
          </h5>
        </div>
        <div class="modal-body text-center">
          <p class="lead mb-3">Delivering happiness, one meal at a time!</p>

          <div class="d-flex justify-content-center gap-3 flex-wrap">
            <img
              src="https://cdn-icons-png.flaticon.com/512/2921/2921822.png"
              alt="Burger"
              width="90"
              class="welcome-img"
            />
            <!-- <img
              src="https://cdn-icons-png.flaticon.com/512/135/135620.png"
              alt="Pizza"
              width="90"
              class="welcome-img"
            />
            <img
              src="https://cdn-icons-png.flaticon.com/512/3081/3081983.png"
              alt="Juice"
              width="90"
              class="welcome-img"
            /> -->
          </div>

          <p class="mt-3 text-muted">
            Sit back and enjoy — your favorite dishes are on the way!
          </p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-brand w-100"
            data-bs-dismiss="modal"
          >
            Start Ordering 🍔
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Script to auto-show modal on every refresh -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var myModal = new bootstrap.Modal(document.getElementById("welcomeModal"));
      myModal.show();
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
